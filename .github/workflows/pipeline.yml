# nome da pipeline
name: "Pipeline Trabalho de Conclusão"

# gatilhos
on:
  # execução por push
  push:
    branches:
      - master

  # execução agendada:
  schedule:
    # execução agendada para cada 10 min inicialmente
    - cron: "*/10 * * * *"

  # execução manual
  workflow_dispatch:

# tarefas / etapas da pipeline
jobs:
  # nome da primeira tarefa / etapa:
  lint:
    name: "Testes Lint"

    # máquina onde irá rodar
    runs-on: ubuntu-latest

    # passos
    steps:
      # clonar o projeto
      - name: Clonando o projeto
        uses: actions/checkout@v4

      # instalar o node
      - name: Instalando node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # instalar yarn
      - name: Instalando Yarn
        run: npm install -g yarn

      # instalar dependências
      - name: Instalando dependências
        run: yarn

      # executar verificação de formatações - Prettier
      - name: Executando testes de formatações
        run: npx prettier --check --ignore-path .gitignore .

      # executar testes lint
      - name: Executando testes lint
        run: npx eslint .

  # nome da segunda tarefa / etapa:
  unit-tests:
    name: "Testes Unitários"

    # máquina onde irá rodar
    runs-on: ubuntu-latest
    needs: [lint]

    # passos
    steps:
      # clonar o projeto
      - name: Clonando o projeto
        uses: actions/checkout@v4

      # instalar o node
      - name: Instalando node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # instalar yarn
      - name: Instalando Yarn
        run: npm install -g yarn

      # instalar dependências
      - name: Instalando dependências
        run: yarn

      # executar testes unitários - mocha
      - name: Executando testes unitários
        run: yarn run test

      # publicar relatório de testes
      - name: Publicando relatório de testes unitários
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-testes-unitarios
          path: mochawesome-report/

      # exibir relatório de testes na interface do GitHub Actions
      - name: Exibindo relatório de testes unitários
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Testes Unitários
          path: mochawesome-report/mochawesome.json
          reporter: mochawesome-json
